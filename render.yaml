databases:
  - name: contactbook-db
    plan: free
    databaseName: contactbook
    user: contactbook

services:
  - type: web
    name: contactbook
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn ContactBook.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: contactbook-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
