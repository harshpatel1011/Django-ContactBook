{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactBook - Edit Comment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" style="max-width: 600px;">
            <div class="page-header">
                <div class="header-text">
                    <h1>Edit Comment</h1>
                </div>
            </div>

            <form method="POST" action="{% url 'comment_update' comment.id %}">
                {% csrf_token %}
                <div class="form-grid">
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label class="form-label" for="text">Comment</label>
                        <textarea id="text" name="text" class="form-input" rows="4" required>{{ comment.text }}</textarea>
                    </div>
                </div>

                <div class="action-buttons" style="justify-content: flex-end; margin-top: 1rem;">
                    <a href="{% url 'post_detail' post.id %}" class="btn-secondary">Cancel</a>
                    <button type="submit" class="btn-primary">Update Comment</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
